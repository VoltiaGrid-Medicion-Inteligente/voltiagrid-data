name: spark-image

# The Spark jobs image (US-40, T-40.1) builds, and Spark writes and reads Parquet through S3A on a MinIO server:
# the same code path as the lake buckets in AWS, without AWS credentials in the CI.
on:
  pull_request:
    branches: [develop, main]
    paths: ["docker/spark/**", "jobs/**", "pipeline/**", "schemas/**", "requirements.txt", ".github/workflows/spark-image.yml"]
  push:
    branches: [develop]
    paths: ["docker/spark/**", "jobs/**", "pipeline/**", "schemas/**", "requirements.txt"]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/spark/Dockerfile -t voltiagrid/spark-jobs:ci .
      - name: MinIO (S3-compatible) with a bucket
        run: |
          echo "MINIO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"   # throwaway, only for this run
          source "$GITHUB_ENV"
          docker network create check
          docker run -d --name minio --network check -e MINIO_ROOT_USER=ci-user -e MINIO_ROOT_PASSWORD="$MINIO_PASSWORD" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do docker run --rm --network check curlimages/curl:8.11.1 -sf http://minio:9000/minio/health/live && break; sleep 2; done
          docker run --rm --network check --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set m http://minio:9000 ci-user $MINIO_PASSWORD && mc mb m/voltiagrid-ci"
      - name: Java, Spark, S3A classes and a write and read on S3
        run: |
          docker run --rm --network check -e AWS_REGION=us-east-1 -e S3_ENDPOINT=http://minio:9000 \
            -e AWS_ACCESS_KEY_ID=ci-user -e AWS_SECRET_ACCESS_KEY="$MINIO_PASSWORD" \
            -e CHECK_S3_URI=s3a://voltiagrid-ci/_check voltiagrid/spark-jobs:ci | tee check.log
          grep -q "s3 write and read: 5 rows" check.log
      - name: A job runs with its arguments, as ECS will start it
        run: docker run --rm voltiagrid/spark-jobs:ci python -m jobs.clean_readings --help
